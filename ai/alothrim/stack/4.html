    <script>
        // 创建一个空对象

        function Person(name,age)
        {   // 构造实例，实例私有的属性
            conosole.log(this);
            this.name =name;
            this.age = age;

        }

        // 原型对象上的方法是公用的
        Person.prototype.poem = '静夜思'
        Person.prototype.say = function()

        }

        const zzz = new Person('ss',19);

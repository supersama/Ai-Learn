<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>趣味生日贺卡生成器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft Yahei", sans-serif;
        }
        body {
            background: linear-gradient(135deg, #ffecd2, #fcb69f);
            min-height: 100vh;
            padding: 40px 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #fff;
            border-radius: 20px;
            padding: 32px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            color: #ff6b6b;
            margin-bottom: 28px;
            font-size: 28px;
        }
        .form-item {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #444;
        }
        input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #ffe0dc;
            border-radius: 10px;
            font-size: 16px;
            outline: none;
            transition: 0.3s;
        }
        input:focus {
            border-color: #ff8787;
        }
        button {
            width: 100%;
            padding: 14px;
            background-color: #ff6b6b;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            cursor: pointer;
            transition: 0.3s;
        }
        button:hover {
            background-color: #fa5252;
        }
        .result-box {
            margin-top: 24px;
            padding: 20px;
            background: #fff5f5;
            border-radius: 12px;
            display: none;
        }
        .result-box h3 {
            color: #ff6b6b;
            margin-bottom:12px;
        }
        .card-text {
            font-size: 17px;
            line-height: 1.7;
            color: #333;
        }
        .copy-btn {
            margin-top:16px;
            background: #74c0fc;
        }
        .copy-btn:hover {
            background: #4dabf7;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎂 生日贺卡生成器</h1>
        <div class="form-item">
            <label>姓名</label>
            <input type="text" id="name" placeholder="请输入对方名字">
        </div>
        <div class="form-item">
            <label>年龄</label>
            <input type="number" id="age" placeholder="请输入年龄">
        </div>
        <div class="form-item">
            <label>爱好</label>
            <input type="text" id="hobby" placeholder="例如：追剧、打球、摄影、美食">
        </div>
        <button id="generateBtn">生成趣味生日祝福</button>

        <div class="result-box" id="resultBox">
            <h3>✨ 你的生日贺卡</h3>
            <p class="card-text" id="cardContent"></p>
            <button class="copy-btn" id="copyBtn">复制祝福语</button>
        </div>
    </div>

    <script>
        const generateBtn = document.getElementById('generateBtn');
        const resultBox = document.getElementById('resultBox');
        const cardContent = document.getElementById('cardContent');
        const copyBtn = document.getElementById('copyBtn');

        // 多套祝福语模板，随机抽取
        const templates = [
            "祝{name}生日快乐！🎉 恭喜解锁{age}岁新版本！愿你继续快乐沉浸在{hobby}里，烦恼全走开，好运排着队来，每一天都闪闪发光！",
            "🎂 生日快乐 {name}！{age}岁的你依旧超有魅力！希望你的{hobby}之旅永远充满惊喜，吃好喝好，万事顺心，岁岁常欢愉！",
            "叮！{name}的{age}岁生日已上线✨！愿热爱{hobby}的你，永远保有这份开心，所有美好如期而至，平安喜乐，暴富变美！",
            "Happy Birthday！{name}！迎来{age}岁啦！继续坚持你的爱好{hobby}，生活里满是小惊喜，没有烦心事，快乐永不打烊🥳",
            "🎈祝{name} {age}岁生日快乐！愿你在{hobby}的世界里自在畅游，日子滚烫，喜乐如常，想要的全都拥有！"
        ];

        generateBtn.onclick = function() {
            const name = document.getElementById('name').value.trim();
            const age = document.getElementById('age').value.trim();
            const hobby = document.getElementById('hobby').value.trim();
            if(!name || !age || !hobby){
                alert("请填写完整：姓名、年龄、爱好");
                return;
            }
            // 随机选一条模板
            const randomTemp = templates[Math.floor(Math.random() * templates.length)];
            const message = randomTemp.replace("{name}", name).replace("{age}", age).replace("{hobby}", hobby);
            cardContent.innerText = message;
            resultBox.style.display = "block";
        }

        // 复制文本功能
        copyBtn.onclick = async function(){
            try {
                await navigator.clipboard.writeText(cardContent.innerText);
                alert("复制成功！可以直接发给朋友啦");
            } catch(err) {
                alert("复制失败，请手动选中文字复制");
            }
        }
    </script>
</body>
</html>

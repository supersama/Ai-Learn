<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>积木体素世界编辑器</title>
<style>
/* ========== CSS 区域 ========== */
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui, sans-serif;}
body{
  background:#fff8e8; /*奶油米色背景*/
  overflow:hidden;
  height:100vh;
}
#canvas-wrap{
  width:100%;height:100%;
}

/* 玻璃拟态面板通用样式 */
.glass{
  background:rgba(255,255,255,0.55);
  backdrop-filter: blur(8px);
  border-radius:12px;
  box-shadow: 0 4px 16px rgba(0,0,0,0.08);
  border:1px solid rgba(255,255,255,0.7);
}

/* 顶部面板 */
#top-bar{
  position:absolute;
  top:16px;
  left:50%;
  transform:translateX(-50%);
  padding:10px 16px;
  display:flex;gap:12px;align-items:center;
  z-index:10;
}
#top-bar h1{font-size:18px;font-weight:600;color:#333;}
button,select{
  padding:6px 10px;border:none;border-radius:8px;
  background:rgba(255,255,255,0.7);
  cursor:pointer;font-size:14px;
}
button:hover{background:rgba(255,255,255,0.95);}

/* 底部工具栏 */
#tool-bar{
  position:absolute;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  padding:12px;
  display:flex;gap:8px;
  z-index:10;
}
.tool-card{
  padding:8px 10px;
  border-radius:10px;
  cursor:pointer;
  text-align:center;
  min-width:70px;
  transition:0.2s;
}
.tool-card.active{
  background:rgba(255,220,100,0.65);
}
.tool-card:hover{
  background:rgba(255,255,255,0.85);
}
.tool-emoji{font-size:22px;margin-bottom:4px;display:block;}
.tool-label{font-size:12px;color:#222;}

/* 提示弹窗 */
#tip-notice{
  position:absolute;
  top:80px;
  left:50%;transform:translateX(-50%);
  padding:12px 20px;
  color:#222;
  opacity:1;
  transition:opacity 1.2s ease-out;
  z-index:11;
}
#tip-notice.fadeout{opacity:0;pointer-events:none;}

/* 右下角小地图 */
#minimap-wrap{
  position:absolute;
  bottom:20px;
  right:20px;
  padding:8px;
  z-index:10;
}
#minimap{
  width:140px;height:140px;
  border-radius:8px;
}
</style>
</head>
<body>
<div id="canvas-wrap"></div>

<!-- UI面板 -->
<div id="top-bar" class="glass">
  <h1>积木世界</h1>
  <select id="world-select">
    <option value="0">世界 1</option>
    <option value="1">世界 2</option>
    <option value="2">世界 3</option>
  </select>
  <button id="btn-reset">🏘️ 生成村庄</button>
  <button id="btn-clear">🌿 全部清空</button>
</div>

<div id="tool-bar" class="glass">
  <div class="tool-card active" data-tool="grass">
    <span class="tool-emoji">🌱</span>
    <span class="tool-label">草地</span>
  </div>
  <div class="tool-card" data-tool="dirt">
    <span class="tool-emoji">🟫</span>
    <span class="tool-label">土路</span>
  </div>
  <div class="tool-card" data-tool="water">
    <span class="tool-emoji">💧</span>
    <span class="tool-label">水</span>
  </div>
  <div class="tool-card" data-tool="stone">
    <span class="tool-emoji">🪨</span>
    <span class="tool-label">石头</span>
  </div>
  <div class="tool-card" data-tool="tree">
    <span class="tool-emoji">🌳</span>
    <span class="tool-label">树</span>
  </div>
  <div class="tool-card" data-tool="house">
    <span class="tool-emoji">🏠</span>
    <span class="tool-label">房子</span>
  </div>
  <div class="tool-card" data-tool="erase">
    <span class="tool-emoji">🧹</span>
    <span class="tool-label">擦除</span>
  </div>
</div>

<div id="tip-notice" class="glass">
🖱️拖拽旋转视角｜滚轮缩放｜点击格子放置物体
</div>

<div id="minimap-wrap" class="glass">
  <canvas id="minimap"></canvas>
</div>

<!-- THREE r128 CDN -->
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script>
// ========== JS 代码 IIFE 包裹 ==========
(function(){
  // ====================== 配置常量 ======================
  const WORLD_SIZE = 8;
  const CELL_SIZE = 1;
  const STORAGE_KEY = "block_world_save";
  const WORLD_COUNT = 3;
  const TOOLS = ["grass","dirt","water","stone","tree","house","erase"];

  // 地形颜色
  const COLORS = {
    grass:0x73b852,
    dirt:0xa07848,
    water:0x4298d8,
    stone:0x999999,
    treeTrunk:0x6b4423,
    treeLeaf:0x389938,
    houseWall:0xe8bc88,
    houseRoof:0xa84838
  };

  // ====================== 全局状态 ======================
  let scene,camera,renderer;
  let worldData = []; // worldData[worldIdx][x][z] = {terrain, kind}
  let currentWorldIdx = 0;
  let selectedTool = "grass";
  let cellMeshes = new Map(); // cellKey -> mesh组
  let hoverMesh = null;
  let raycaster = new THREE.Raycaster();
  let mouse = new THREE.Vector2();

  // 相机拖拽状态
  let isDrag = false;
  let dragStart = {x:0,y:0};
  let cameraTheta = Math.PI/4;
  let cameraPhi = Math.PI/3;
  let cameraDist = 12;

  // 小地图
  const minimapCanvas = document.getElementById("minimap");
  const minimapCtx = minimapCanvas.getContext("2d");
  minimapCanvas.width = 140;
  minimapCanvas.height = 140;

  // ====================== 初始化场景、光照 ======================
  function initScene(){
    scene = new THREE.Scene();

    // 柔和日光
    const dirLight = new THREE.DirectionalLight(0xfff9e8, 0.9);
    dirLight.position.set(6,12,4);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.width=1024;
    dirLight.shadow.mapSize.height=1024;
    dirLight.shadow.radius = 4; //软阴影
    dirLight.shadow.camera.near = 1;
    dirLight.shadow.camera.far = 30;
    dirLight.shadow.camera.left = -10;
    dirLight.shadow.camera.right = 10;
    dirLight.shadow.camera.top = 10;
    dirLight.shadow.camera.bottom = -10;
    scene.add(dirLight);

    const ambientLight = new THREE.AmbientLight(0xfff2d8, 0.35);
    scene.add(ambientLight);

    // 相机
    camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    updateCameraPos();

    renderer = new THREE.WebGLRenderer({antialias:true});
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.getElementById("canvas-wrap").appendChild(renderer.domElement);
  }
  function updateCameraPos(){
    const cx = cameraDist * Math.sin(cameraPhi) * Math.cos(cameraTheta);
    const cy = cameraDist * Math.cos(cameraPhi);
    const cz = cameraDist * Math.sin(cameraPhi) * Math.sin(cameraTheta);
    camera.position.set(cx, cy, cz);
    camera.lookAt(WORLD_SIZE/2, 0, WORLD_SIZE/2);
  }

  // ====================== 数据持久化 / 世界数据 ======================
  function initWorldStorage(){
    const saved = localStorage.getItem(STORAGE_KEY);
    if(saved){
      worldData = JSON.parse(saved);
    }else{
      // 初始化3个世界全草地
      worldData = [];
      for(let w=0;w<WORLD_COUNT;w++){
        const wd = [];
        for(let x=0;x<WORLD_SIZE;x++){
          wd[x] = [];
          for(let z=0;z<WORLD_SIZE;z++){
            wd[x][z] = {terrain:"grass", kind:null};
          }
        }
        worldData.push(wd);
      }
    }
  }
  function saveWorldToLocal(){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(worldData));
  }
  // 唯一写入入口 setCell
  function setCell(x,z,cellObj){
    if(x<0||x>=WORLD_SIZE||z<0||z>=WORLD_SIZE) return;
    worldData[currentWorldIdx][x][z] = {...cellObj};
    rebuildCellMesh(x,z);
    saveWorldToLocal();
    drawMinimap();
  }
  function getCell(x,z){
    return worldData[currentWorldIdx][x][z];
  }
  function switchWorld(worldIdx){
    currentWorldIdx = worldIdx;
    clearAllCellMeshes();
    buildAllCellMesh();
    drawMinimap();
  }

  // ====================== 几何体工厂，生成地块/物体 ======================
  function makeTerrainMesh(terrainType, x,z){
    const geo = new THREE.BoxGeometry(CELL_SIZE, 0.22, CELL_SIZE);
    const mat = new THREE.MeshLambertMaterial({color:COLORS[terrainType]});
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.set(x, 0.11, z);
    mesh.receiveShadow = true;
    return mesh;
  }
  function makeTree(x,z){
    const group = new THREE.Group();
    //树干
    const trunkGeo = new THREE.CylinderGeometry(0.12,0.16,0.7,8);
    const trunkMat = new THREE.MeshLambertMaterial({color:COLORS.treeTrunk});
    const trunk = new THREE.Mesh(trunkGeo, trunkMat);
    trunk.position.y = 0.35;
    trunk.castShadow = true;
    group.add(trunk);
    //树冠
    const leafGeo = new THREE.IcosahedronGeometry(0.45,0);
    const leafMat = new THREE.MeshLambertMaterial({color:COLORS.treeLeaf});
    const leaf = new THREE.Mesh(leafGeo, leafMat);
    leaf.position.y = 0.9;
    leaf.castShadow = true;
    group.add(leaf);
    group.position.set(x,0.22,z);
    return group;
  }
  function makeHouse(x,z){
    const group = new THREE.Group();
    //墙体
    const wallGeo = new THREE.BoxGeometry(0.8,0.65,0.8);
    const wallMat = new THREE.MeshLambertMaterial({color:COLORS.houseWall});
    const wall = new THREE.Mesh(wallGeo, wallMat);
    wall.position.y = 0.325;
    wall.castShadow = true;
    group.add(wall);
    //屋顶
    const roofGeo = new THREE.ConeGeometry(0.65,0.45,4);
    const roofMat = new THREE.MeshLambertMaterial({color:COLORS.houseRoof});
    const roof = new THREE.Mesh(roofGeo, roofMat);
    roof.position.y = 0.65+0.225;
    roof.rotation.y = Math.PI/4;
    roof.castShadow = true;
    group.add(roof);
    group.position.set(x,0.22,z);
    return group;
  }
  function makeStone(x,z){
    const group = new THREE.Group();
    const stoneGeo = new THREE.IcosahedronGeometry(0.28,0);
    const stoneMat = new THREE.MeshLambertMaterial({color:COLORS.stone});
    const stone = new THREE.Mesh(stoneGeo, stoneMat);
    stone.position.y = 0.2;
    stone.castShadow = true;
    group.add(stone);
    group.position.set(x,0.22,z);
    return group;
  }

  // ====================== 网格渲染管理 ======================
  function clearAllCellMeshes(){
    cellMeshes.forEach((grp)=> scene.remove(grp));
    cellMeshes.clear();
  }
  function rebuildCellMesh(x,z){
    const key = `${x},${z}`;
    if(cellMeshes.has(key)) scene.remove(cellMeshes.get(key));
    const cell = getCell(x,z);
    const group = new THREE.Group();
    const terrainMesh = makeTerrainMesh(cell.terrain, x,z);
    group.add(terrainMesh);
    if(cell.kind === "tree") group.add(makeTree(x,z));
    if(cell.kind === "house") group.add(makeHouse(x,z));
    if(cell.kind === "stone") group.add(makeStone(x,z));
    cellMeshes.set(key, group);
    scene.add(group);
  }
  function buildAllCellMesh(){
    for(let x=0;x<WORLD_SIZE;x++){
      for(let z=0;z<WORLD_SIZE;z++){
        rebuildCellMesh(x,z);
      }
    }
  }

  // ====================== 悬停高亮格子 ======================
  function createHoverMesh(){
    const geo = new THREE.BoxGeometry(CELL_SIZE,0.25,CELL_SIZE);
    const mat = new THREE.MeshBasicMaterial({color:0xffffff, transparent:true, opacity:0.35});
    hoverMesh = new THREE.Mesh(geo, mat);
    hoverMesh.visible = false;
    scene.add(hoverMesh);
  }
  function updateHover(intersect){
    if(!intersect){
      hoverMesh.visible = false;
      return null;
    }
    const point = intersect.point;
    const x = Math.floor(point.x + 0.5);
    const z = Math.floor(point.z + 0.5);
    if(x>=0&&x<WORLD_SIZE&&z>=0&&z<WORLD_SIZE){
      hoverMesh.position.set(x,0.13,z);
      hoverMesh.visible = true;
      return {x,z};
    }else{
      hoverMesh.visible = false;
      return null;
    }
  }

  // ====================== 鼠标交互（射线检测、放置） ======================
  function onPointerMove(evt){
    const rect = renderer.domElement.getBoundingClientRect();
    mouse.x = ((evt.clientX - rect.left)/rect.width)*2 -1;
    mouse.y = -((evt.clientY - rect.top)/rect.height)*2 +1;
    raycaster.setFromCamera(mouse, camera);
    const plane = new THREE.Plane(new THREE.Vector3(0,1,0), 0);
    const intersect = new THREE.Vector3();
    raycaster.ray.intersectPlane(plane, intersect);
    const cellPos = updateHover({point:intersect});
    //拖拽旋转
    if(isDrag){
      const dx = evt.clientX - dragStart.x;
      const dy = evt.clientY - dragStart.y;
      cameraTheta += dx * 0.01;
      cameraPhi = Math.max(0.2, Math.min(Math.PI/2 -0.05, cameraPhi + dy *0.01));
      updateCameraPos();
      dragStart.x = evt.clientX;
      dragStart.y = evt.clientY;
    }
  }
  function onPointerDown(evt){
    if(evt.button !==0) return;
    const rect = renderer.domElement.getBoundingClientRect();
    mouse.x = ((evt.clientX - rect.left)/rect.width)*2 -1;
    mouse.y = -((evt.clientY - rect.top)/rect.height)*2 +1;
    raycaster.setFromCamera(mouse, camera);
    const plane = new THREE.Plane(new THREE.Vector3(0,1,0), 0);
    const intersect = new THREE.Vector3();
    raycaster.ray.intersectPlane(plane, intersect);
    const cellPos = updateHover({point:intersect});
    if(cellPos){
      applyTool(cellPos.x, cellPos.z);
    }
    isDrag = true;
    dragStart.x = evt.clientX;
    dragStart.y = evt.clientY;
  }
  function onPointerUp(){
    isDrag = false;
  }
  function onWheel(evt){
    evt.preventDefault();
    cameraDist += evt.deltaY * 0.004;
    cameraDist = THREE.MathUtils.clamp(cameraDist, 4, 22);
    updateCameraPos();
  }
  function applyTool(x,z){
    const cell = getCell(x,z);
    let newCell = {...cell};
    switch(selectedTool){
      case "grass": newCell.terrain="grass";newCell.kind=null;break;
      case "dirt": newCell.terrain="dirt";newCell.kind=null;break;
      case "water": newCell.terrain="water";newCell.kind=null;break;
      case "stone": newCell.terrain="grass";newCell.kind="stone";break;
      case "tree": newCell.terrain="grass";newCell.kind="tree";break;
      case "house": newCell.terrain="grass";newCell.kind="house";break;
      case "erase": newCell.terrain="grass";newCell.kind=null;break;
    }
    setCell(x,z, newCell);
  }

  // ====================== 生成村庄（程序化） ======================
  function generateVillage(){
    //先全部草地
    for(let x=0;x<WORLD_SIZE;x++){
      for(let z=0;z<WORLD_SIZE;z++){
        setCell(x,z,{terrain:"grass", kind:null});
      }
    }
    //水塘
    const pondX = 6, pondZ = 6;
    setCell(pondX,pondZ, {terrain:"water", kind:null});
    setCell(pondX-1,pondZ, {terrain:"water", kind:null});
    setCell(pondX,pondZ-1, {terrain:"water", kind:null});
    //土路连通
    setCell(1,1, {terrain:"dirt", kind:null});
    setCell(2,1, {terrain:"dirt", kind:null});
    setCell(3,1, {terrain:"dirt", kind:null});
    setCell(3,2, {terrain:"dirt", kind:null});
    setCell(3,3, {terrain:"dirt", kind:null});
    setCell(4,3, {terrain:"dirt", kind:null});
    setCell(5,3, {terrain:"dirt", kind:null});
    setCell(5,4, {terrain:"dirt", kind:null});
    setCell(5,5, {terrain:"dirt", kind:null});
    //房子
    setCell(2,2, {terrain:"grass", kind:"house"});
    setCell(4,4, {terrain:"grass", kind:"house"});
    //树
    setCell(1,3, {terrain:"grass", kind:"tree"});
    setCell(6,2, {terrain:"grass", kind:"tree"});
    setCell(2,5, {terrain:"grass", kind:"tree"});
    //石堆
    setCell(4,1, {terrain:"grass", kind:"stone"});
    setCell(6,4, {terrain:"grass", kind:"stone"});
  }
  function clearAllGrass(){
    for(let x=0;x<WORLD_SIZE;x++){
      for(let z=0;z<WORLD_SIZE;z++){
        setCell(x,z,{terrain:"grass", kind:null});
      }
    }
  }

  // ====================== 小地图绘制 ======================
  function drawMinimap(){
    const w = minimapCanvas.width;
    const h = minimapCanvas.height;
    const cellPx = w / WORLD_SIZE;
    minimapCtx.clearRect(0,0,w,h);
    for(let x=0;x<WORLD_SIZE;x++){
      for(let z=0;z<WORLD_SIZE;z++){
        const cell = getCell(x,z);
        let c;
        if(cell.terrain === "grass") c="#73b852";
        else if(cell.terrain === "dirt") c="#a07848";
        else if(cell.terrain === "water") c="#4298d8";
        else c="#73b852";
        minimapCtx.fillStyle = c;
        minimapCtx.fillRect(x*cellPx, z*cellPx, cellPx, cellPx);
        //物体阴影标记
        if(cell.kind === "tree"){
          minimapCtx.fillStyle="#225522";
          minimapCtx.beginPath();
          minimapCtx.arc(x*cellPx+cellPx/2,z*cellPx+cellPx/2, cellPx*0.3,0,Math.PI*2);
          minimapCtx.fill();
        }else if(cell.kind === "house"){
          minimapCtx.fillStyle="#903828";
          minimapCtx.fillRect(x*cellPx+cellPx*0.25,z*cellPx+cellPx*0.25, cellPx*0.5, cellPx*0.5);
        }else if(cell.kind === "stone"){
          minimapCtx.fillStyle="#555555";
          minimapCtx.beginPath();
          minimapCtx.arc(x*cellPx+cellPx/2,z*cellPx+cellPx/2, cellPx*0.25,0,Math.PI*2);
          minimapCtx.fill();
        }
      }
    }
  }

  // ====================== UI事件绑定 ======================
  function bindUI(){
    //工具卡片选择
    document.querySelectorAll(".tool-card").forEach(el=>{
      el.onclick = ()=>{
        document.querySelectorAll(".tool-card").forEach(e=>e.classList.remove("active"));
        el.classList.add("active");
        selectedTool = el.dataset.tool;
      }
    });
    //世界切换下拉
    document.getElementById("world-select").onchange = (e)=>{
      switchWorld(parseInt(e.target.value));
    };
    //按钮
    document.getElementById("btn-reset").onclick = generateVillage;
    document.getElementById("btn-clear").onclick = clearAllGrass;
    //提示自动淡出
    setTimeout(()=>{
      document.getElementById("tip-notice").classList.add("fadeout");
    },4000);

    //画布事件
    const canvasDom = renderer.domElement;
    canvasDom.addEventListener("pointermove", onPointerMove);
    canvasDom.addEventListener("pointerdown", onPointerDown);
    canvasDom.addEventListener("pointerup", onPointerUp);
    canvasDom.addEventListener("wheel", onWheel, {passive:false});
    canvasDom.addEventListener("pointerleave", ()=>{hoverMesh.visible=false;});

    window.addEventListener("resize", ()=>{
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  }

  // ====================== 渲染循环 ======================
  function animate(){
    requestAnimationFrame(animate);
    renderer.render(scene, camera);
  }

  // ====================== 启动入口 ======================
  function start(){
    initScene();
    initWorldStorage();
    createHoverMesh();
    buildAllCellMesh();
    drawMinimap();
    bindUI();
    animate();
  }
  start();
})();
</script>
</body>
</html>
